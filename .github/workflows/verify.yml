# The same script a person runs locally (12 §4.6). One file, one command — a green CI and a green
# laptop have to mean the same thing, and they only do when they run the same thing.
name: verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The library, next door, exactly as it is on a developer's machine. Without it the build
      # falls back to Maven coordinates, which is mode C and a different thing to test.
      #
      # This said `m42cx/superizer` until it was checked: no such repository exists, so this job
      # had never got past here. The slug now comes from the same repository variable
      # android-play.yml reads, so a rename is one setting rather than two files that drift.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          ref: ${{ vars.SUPERIZER_REF || '' }}
          path: superizer-checkout

      - name: Put the library where settings.gradle.kts looks for it
        run: mv superizer-checkout ../superizer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # `packages` named explicitly. The action's default is `tools platform-tools`, and the SDK
      # repository no longer has `tools` — it fails with "Failed to find package 'tools'" and takes
      # the whole job with it, which is what happened on the first run of this file. The list
      # matches android-play.yml so the two jobs build against the same SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Chromium for the wasm tests (Karma) and the web smoke test. Playwright's own, so the two
      # agree about which browser they are talking to.
      - name: Install Chromium
        run: npx --yes playwright@1.49.0 install --with-deps chromium

      # The real tools the keyring is held to (ssh-new 03 §4, D158). Without them the interop tests
      # skip by name — fine on a laptop, not here: CI is where they must actually run.
      - name: Install OpenSSH and age
        run: sudo apt-get update && sudo apt-get install -y openssh-client openssh-server age

      - name: Verify
        run: ./scripts/verify.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify
          path: build/verify/
