# The same script a person runs locally (12 §4.6). One file, one command — a green CI and a green
# laptop have to mean the same thing, and they only do when they run the same thing.
name: verify

# By hand only (owner, 2026-10-05): it never held a release back — android-play.yml runs its own
# `./gradlew verify` before the upload — so on every push it only spent runner time. Run it with
# `gh workflow run verify.yml --ref main` when the browser, the emulator or real ssh/age matter.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The library, next door, exactly as it is on a developer's machine. Without it the build
      # falls back to Maven coordinates, which is mode C and a different thing to test.
      #
      # This said `m42cx/superizer` until it was checked: no such repository exists, so this job
      # had never got past here. The slug now comes from the same repository variable
      # android-play.yml reads, so a rename is one setting rather than two files that drift.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          ref: ${{ vars.SUPERIZER_REF || '' }}
          path: superizer-checkout

      - name: Put the library where settings.gradle.kts looks for it
        run: mv superizer-checkout ../superizer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # `packages` named explicitly. The action's default is `tools platform-tools`, and the SDK
      # repository no longer has `tools` — it fails with "Failed to find package 'tools'" and takes
      # the whole job with it, which is what happened on the first run of this file. The list
      # matches android-play.yml so the two jobs build against the same SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Chromium for the wasm tests (Karma) and the web smoke test. Playwright's own, so the two
      # agree about which browser they are talking to.
      - name: Install Chromium
        run: npx --yes playwright@1.49.0 install --with-deps chromium

      # The real tools the keyring is held to (ssh-new 03 §4, D158). Without them the interop tests
      # skip by name — fine on a laptop, not here: CI is where they must actually run.
      - name: Install OpenSSH and age
        run: sudo apt-get update && sudo apt-get install -y openssh-client openssh-server age

      - name: Verify
        run: ./scripts/verify.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify
          path: build/verify/

  # The Keystore has no stand-in (ssh-new 04 §9, Б11): the vault, the keyring's backend and the
  # self-test run on an emulator here, as verify.sh runs them on one attached locally. API 33 is
  # the oldest with Curve25519 in the Keystore — the floor the keyring's level 1 needs for Ed25519.
  device:
    runs-on: ubuntu-latest
    steps:
      # The emulator checks free space before it boots and refuses on a stock runner: "Your device
      # does not have enough disk space to run avd", then ten minutes of "device not found" until the
      # boot timeout — which is how this job failed the first time it ran. None of these is used here.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/local/julia* /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          ref: ${{ vars.SUPERIZER_REF || '' }}
          path: superizer-checkout

      - name: Put the library where settings.gradle.kts looks for it
        run: mv superizer-checkout ../superizer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Hosted runners have KVM, but only root may open it until this rule says otherwise.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :services:vault:connectedDebugAndroidTest :services:ssh:connectedDebugAndroidTest :composeApp:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device
          path: |
            services/*/build/reports/androidTests/
            composeApp/build/reports/androidTests/
