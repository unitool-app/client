# MaxMetaspaceSize is the one that matters here and it is not the one people set: the Compose
# compiler plugin and AGP between them load enough classes that the JVM's 512m default runs out
# part-way through a release build, and the daemon then restarts and recompiles everything from
# cold. The heap was never the problem.
# Raised from 1g when the app gained Firebase. The build now warns
# "The Daemon will expire after the build after running out of JVM Metaspace" at 1g, and
# an expired daemon means the next build recompiles everything from cold.
# Raised to 3g with the fourth app: at 2g `scripts/verify.sh` — tests, screenshots, wasm, debug and
# release in one daemon — ran out of Metaspace in lint and R8 at the very end, while
# `assembleRelease` on its own still passed.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official

# iOS klibs compile on Linux (Kotlin 2.4 cross-compiles Apple targets); linking and iOS tests need a
# Mac. Skipped there without a warning on every build — verify.sh names the skip instead.
kotlin.native.ignoreDisabledTargets=true

# Reuse the Kotlin compiler daemon and let incremental compilation work across builds.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true
